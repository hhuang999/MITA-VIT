[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastweight-vit"
version = "0.2.0"
description = "Tools and experiments for analyzing ViT attention maps through fast and slow weights"
requires-python = ">=3.11,<3.13"
dependencies = [
    "timm==1.0.30",
    "datasets",
    "huggingface-hub",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "pillow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
download = ["gdown==5.2.0"]
paper = ["pymupdf==1.27.2.3"]

[project.urls]
Repository = "https://github.com/hhuang999/vit-fastweight-lens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
