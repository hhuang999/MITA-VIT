[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastweight-vit"
version = "0.1.0"
description = "A top-k neuron probe for Vision Transformer attention, tested by sufficiency and necessity"
requires-python = ">=3.11,<3.13"
dependencies = [
    "timm==1.0.30",
    "datasets",
    "huggingface-hub",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "pillow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
