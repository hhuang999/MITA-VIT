name: Research artifact checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch.txt
      - name: Install pinned CPU environment
        run: |
          python -m pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Import and entry points
        run: |
          python -c "import fastweight_vit.readings, fastweight_vit.evidence, fastweight_vit.experiments.sanity"
          python scripts/run.py --help
          python scripts/prepare_data.py --help
      - name: CPU regression tests
        run: python -m pytest -q
      - name: Rebuild the main figures and tables
        run: python rebuild_main.py
      - name: Check that saved results are unchanged
        run: git diff --exit-code -- results experiments data/splits
