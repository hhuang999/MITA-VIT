name: Paper v8 CPU release checks

on:
  push:
    branches: [paperv8, release/v1]
  pull_request:
    branches: [release/v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch.txt
      - name: Install pinned CPU environment
        run: |
          python -m pip install -r requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Import and entry points
        run: |
          python -c "import fastweight_vit.readings, fastweight_vit.release"
          python scripts/run.py --help
          python scripts/prepare_data.py --help
      - name: CPU regression tests
        run: python -m pytest -q
      - name: Integrity, saved-output rebuild and real archive
        run: python scripts/validate_release.py --strict --rebuild --archive-check --report build/ci-verification.json
      - name: Verify original artifacts are unchanged
        run: git diff --exit-code -- outputs results figures paper
