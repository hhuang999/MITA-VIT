# Exploratory checks: MLP position probes and the globalisation analysis on the held-out images.
experiment: supplementary
stage: heldout
models: [deit, deit_b, dino]
batch_size: 64
num_workers: 2
diagnose:
  dataset: imagenet_s
  duplicate_threshold: 0.9
  epochs: 30
  heldout_seed: 0
  mean_images: 2000
  norm_ratio: 3
  probe_images: 2000
  probe_run: outputs/diagnose_probe/{model}
  seed: 0
  high_norm_dataset: imagenet_s
correct:
  lens_runs:
    probe: outputs/diagnose_probe/{model}
    mean_maps: outputs/diagnose_mean_maps/{model}
  budgets: [1, 2, 4, 8, 16, 32, 64, 98, 147]
  conditions: [drop_top, drop_bottom]
  dataset: imagenet_s
  faithfulness_images: 2000
  gallery_images: 24
  no_srg: [R0_early, C2_early]
  norm_ratio: 3
  random_seed: 0
  shards: 17
  subset_seed: 0
  tie_seed: 0
  methods:
  - layers: [9, 10, 11, 12]
    name: R0
    reading: R0
  - layers: [9, 10, 11, 12]
    name: C1
    reading: C1
  - layers: [9, 10, 11, 12]
    name: C2
    reading: C2
  - layers: [9, 10, 11, 12]
    name: C3
    reading: C3
  - layers: [9, 10, 11, 12]
    name: R_all
    reading: R_all
  - layers: [9, 10, 11, 12]
    name: stand_in_blur
    reading: stand_in_blur
  - layers: [9, 10, 11, 12]
    name: stand_in_no_high
    reading: stand_in_no_high
  - layers: [9, 10, 11, 12]
    name: stand_in_centre
    reading: stand_in_centre
  - layers: [9, 10, 11, 12]
    name: mean_map
    reading: mean_map
  - method: gae
    name: gae
  - method: centre
    name: centre
  - method: random
    name: random
  - layers: [8]
    name: R0_l8
    reading: R0
  - layers: [9]
    name: R0_l9
    reading: R0
  - layers: [10]
    name: R0_l10
    reading: R0
  - layers: [11]
    name: R0_l11
    reading: R0
  - layers: [12]
    name: R0_l12
    reading: R0
  - layers: [12]
    name: C1_l12
    reading: C1
  - layers: [12]
    name: C2_l12
    reading: C2
  - layers: [12]
    name: C3_l12
    reading: C3
  - layers: [12]
    name: R_all_l12
    reading: R_all
  - layers: [1, 2, 3, 4]
    name: R0_early
    reading: R0
  - layers: [1, 2, 3, 4]
    name: C2_early
    reading: C2
supplementary:
  dataset: imagenet_s
  heldout_run: outputs/supplementary_heldout/{model}
  layer_groups: 3
  mlp_hidden: 1024
  srg_maps: [R0, C3, C1C3, C3_centre, C2MLP]
