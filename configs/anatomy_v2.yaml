# V2 anatomy experiments. Frozen before any V2 result is viewed; see
# docs/research_design_v2.md section 7 and the prediction table in section 8.
design: docs/research_design_v2.md
model: deit_small_patch16_224.fb_in1k
device: cuda
batch_size: 32
num_workers: 2
subset_seed: 0
n_images: 5000
indices: data/imagenet_val_indices_seed0.json
bootstrap_resamples: 1000
bootstrap_seed: 0
confidence_level: 0.95
random_seeds: [0, 1, 2, 3, 4]

# Main budget: m = 16 regions (m_side 4), k = 16 tokens; spatial routing; CLS reads its own set.
main: {m_side: 4, k: 16, routing: spatial, cls: own, scoring: query, summary_scale: mita}

# RQ1: one layer replaced at a time; 17 settings per layer.
rq1:
  k: [16]
  per_query_k: [16, 32]  # L1 at k and at k + m (equal slot budget for the sharing index)

# RQ2: all layers replaced at once. Each entry: mode, m_side, k, plus overrides of `main`.
rq2:
  k_sweep: [4, 8, 16, 32, 64, 128]
  m_sweep: [1, 2, 4, 7, 14]
  settings:
    - {name: L1, mode: L1, sweep: k}
    - {name: L2, mode: L2, sweep: m}
    - {name: L3_spatial, mode: L3, sweep: k}
    - {name: L3_dot, mode: L3, routing: dot, sweep: k}
    - {name: L4_spatial, mode: L4, sweep: k}
    - {name: L4_dot, mode: L4, routing: dot, sweep: k}
    - {name: L3_spatial_m, mode: L3, sweep: m}
    - {name: L3_dot_m, mode: L3, routing: dot, sweep: m}
    - {name: L4_spatial_m, mode: L4, sweep: m}
    - {name: L4_dot_m, mode: L4, routing: dot, sweep: m}
    - {name: rand, mode: rand, sweep: k, seeds: true}
    - {name: randC, mode: randC, seeds: true}
    - {name: v1_regression, mode: L3, routing: dot, cls: routed, sweep: k}
    - {name: mita_default_dot, mode: L4, m_side: 5, k: 25, routing: dot, cls: routed, landmark_mode: mita}
    - {name: mita_default_spatial, mode: L4, m_side: 5, k: 25}
    - {name: ablate_cls_routed_L3, mode: L3, cls: routed}
    - {name: ablate_cls_routed_L4, mode: L4, cls: routed}
    - {name: ablate_attention_scoring_L3, mode: L3, scoring: attention}
    - {name: ablate_attention_scoring_L4, mode: L4, scoring: attention}
    - {name: ablate_standard_scale_L2, mode: L2, summary_scale: standard}
    - {name: ablate_standard_scale_L4, mode: L4, summary_scale: standard}

# Noise floor: crop window moved right by one pixel, original model only.
noise: {shift_pixels: 1}

# RQ3: MiTA-DeiT-S contrast.
mita:
  checkpoint: checkpoints/mita/best_checkpoint.pth
  m_side: 5
  k: 25
  reproduce_images: 50000
  reported_top1: 79.8
  reproduce_tolerance_pp: 0.2
pet:
  images: 3669
  sink_threshold: 3
  composition: [{m_side: 4, k: 16, landmark_mode: clean}, {m_side: 5, k: 25, landmark_mode: clean},
                {m_side: 5, k: 25, landmark_mode: mita}]
  example_indices: [2335, 1874, 989]
  deletion_categories: [sink, foreground, background]
