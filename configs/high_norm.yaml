# Figure 3(c) and section 4.3: per ImageNet-S image and layer, the share of R0 on high-norm patches (block input
# norm > 3 x the image median) and the value-norm ratio of high-norm to ordinary patches. Each model's own
# preprocessing, all 12,419 images.
experiment: diagnose
stage: high_norm
models:
  deit:
    batch_size: 128
  deit_b:
    batch_size: 64
  dino:
    batch_size: 128
num_workers: 2
diagnose:
  dataset: imagenet_s
  duplicate_threshold: 0.9
  epochs: 30
  heldout_seed: 0
  mean_images: 2000
  norm_ratio: 3
  probe_images: 2000
  probe_run: outputs/diagnose_probe/{model}
  seed: 0
  high_norm_dataset: imagenet_s
