# RQ3 parts (E8, fastweight_vit.experiments.parts): PartImageNet_Seg, all 24,080 images (ImageNet training images).
# The methods and probe settings are those of explanations.yaml; `layerwise` adds the probe at each single layer.
base: explanations.yaml
parts:
  layerwise: true
  random_seed: 0                # the 'random' reference map
  seeds: [0, 1, 2, 3, 4]        # which patches are removed in the reliance test
  removed: [4, 8]               # patches removed per condition; 4 is the registered primary count
