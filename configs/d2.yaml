# Probability discount (exploratory, proposed after the main results; registered before running): discount without
# relocation. D2 = R0 x P_l(j | x_j) per layer, layers 9-12; stand-in D2_shuffle (P_l(j | x_j) permuted within image
# and layer, seeds 0-4, averaged per image); C3D2 = C3 x P_l(j | x_j), reported only under branch A of the rule in
# docs/preregistration.md. Enrichment and ClickMe only (no SRG). Needs the diagnose outputs.
experiment: correct
models: [deit, deit_b, dino]
datasets: [imagenet_s, clickme]
batch_size: 64
num_workers: 2
correct:
  lens_runs:
    probe: outputs/diagnose_probe/{model}
    mean_maps: outputs/diagnose_mean_maps/{model}
  budgets: [1, 2, 4, 8, 16, 32, 64, 98, 147]
  conditions: [drop_top, drop_bottom]
  dataset: imagenet_s
  faithfulness_images: 0
  gallery_images: 0
  no_srg: [R0_early, C2_early]
  norm_ratio: 3
  random_seed: 0
  shards: 17
  subset_seed: 0
  tie_seed: 0
  methods:
  - {name: R0, reading: R0, layers: [9, 10, 11, 12]}
  - {name: C2, reading: C2, layers: [9, 10, 11, 12]}
  - {name: C3, reading: C3, layers: [9, 10, 11, 12]}
  - {name: D2, reading: D2, layers: [9, 10, 11, 12]}
  - {name: D2_shuffle_s0, reading: D2_shuffle, seed: 0, layers: [9, 10, 11, 12]}
  - {name: D2_shuffle_s1, reading: D2_shuffle, seed: 1, layers: [9, 10, 11, 12]}
  - {name: D2_shuffle_s2, reading: D2_shuffle, seed: 2, layers: [9, 10, 11, 12]}
  - {name: D2_shuffle_s3, reading: D2_shuffle, seed: 3, layers: [9, 10, 11, 12]}
  - {name: D2_shuffle_s4, reading: D2_shuffle, seed: 4, layers: [9, 10, 11, 12]}
  - {name: C3D2, reading: C3D2, layers: [9, 10, 11, 12]}
