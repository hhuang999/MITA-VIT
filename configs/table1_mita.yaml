# "Top-k training" row of the main results table: MiTA-DeiT-S (weights: scripts/download_models.py), R0 on the
# protocol of the main results table.
experiment: correct
models: [mita]
datasets: [imagenet_s, clickme]
batch_size: 64
num_workers: 2
correct:
  lens_runs:
    probe: outputs/diagnose_probe/{model}
    mean_maps: outputs/diagnose_mean_maps/{model}
  budgets: [1, 2, 4, 8, 16, 32, 64, 98, 147]
  conditions: [drop_top, drop_bottom]
  dataset: imagenet_s
  faithfulness_images: 2000
  gallery_images: 0
  no_srg: [R0_early, C2_early]
  norm_ratio: 3
  random_seed: 0
  shards: 17
  subset_seed: 0
  tie_seed: 0
  methods:
  - name: R0
    reading: R0
    layers: [9, 10, 11, 12]
  - name: R0_l12
    reading: R0
    layers: [12]
  variant: mita
