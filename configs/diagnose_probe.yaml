# Premise of C2: held-out images (4,000 ImageNet validation images that are neither
# ImageNet-S nor near-duplicates of ClickMe images; data/splits/heldout_4000.json lists them), one linear position
# probe per layer trained on the first 2,000, tested on the other 2,000; C2's displacement and the matched blur
# width.
experiment: diagnose
stage: probe
models: [deit, deit_b, dino]
batch_size: 64
num_workers: 2
diagnose:
  dataset: imagenet_s
  duplicate_threshold: 0.9
  epochs: 30
  heldout_seed: 0
  mean_images: 2000
  norm_ratio: 3
  probe_images: 2000
  probe_run: outputs/diagnose_probe/{model}
  seed: 0
  high_norm_dataset: imagenet_s
