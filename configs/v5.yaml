# v5 (decisions B33-B40): the fast-weight lens, read -> diagnose -> correct. Shared settings; the experiment
# configs below inherit this file. Values marked "author" were confirmed by the author on 2026-11-05 (B41) and
# are frozen for the formal runs.
base: explanations.yaml
design: docs/experiment_plan_v5.md
batch_size: 64

diagnose:
  heldout_seed: 0               # order in which ImageNet validation rows are drawn for the held-out set
  duplicate_threshold: 0.9      # thumbnail correlation at which a candidate counts as a ClickMe image
  probe_images: 2000            # author: held-out images that train the position probes
  mean_images: 2000             # author: further held-out images for mean maps, probe test and blur width
  epochs: 30                    # E3 probe training (identity.train_position_probe), unchanged
  seed: 0
  norm_ratio: 3                 # high-norm definition (B24)
  dataset: imagenet_s           # evaluation images of the M1 share
  probe_run: experiments/2026-11-05_diagnose_probe_{model}

correct:
  lens_runs:
    probe: experiments/2026-11-05_diagnose_probe_{model}
    m1: experiments/2026-11-05_diagnose_m1_{model}
  norm_ratio: 3
  dataset: imagenet_s
  shards: 17
  faithfulness_images: 2000     # author: fixed random ImageNet-S subset for SRG (the S1 DeiT-B subset)
  subset_seed: 0
  tie_seed: 0
  random_seed: 0
  budgets: [1, 2, 4, 8, 16, 32, 64, 98, 147]
  conditions: [drop_top, drop_bottom]   # SRG = AUC(drop_bottom) - AUC(drop_top) (B11)
  gallery_images: 24            # B16: seeded random draw, no picking
  no_srg: [R0_early, C2_early]  # B41: P4b is judged on enrichment and ClickMe only
  gate: experiments/2026-11-03_ab_t2_deit/gate.json   # test-time register units (variant: register)
  # Table 1 rows. Deep = layers 9-12 summed; last = layer 12; early = layers 1-4 (negative control P4).
  methods:
    - {name: R0, reading: R0, layers: [9, 10, 11, 12]}
    - {name: C1, reading: C1, layers: [9, 10, 11, 12]}
    - {name: C2, reading: C2, layers: [9, 10, 11, 12]}
    - {name: C3, reading: C3, layers: [9, 10, 11, 12]}
    - {name: R_all, reading: R_all, layers: [9, 10, 11, 12]}
    - {name: blur, reading: blur, layers: [9, 10, 11, 12]}
    - {name: no_high, reading: no_high, layers: [9, 10, 11, 12]}
    - {name: centre_sub, reading: centre_sub, layers: [9, 10, 11, 12]}
    - {name: mean_map, reading: mean_map, layers: [9, 10, 11, 12]}
    - {name: gae, method: gae}
    - {name: centre, method: centre}
    - {name: random, method: random}
    - {name: R0_l8, reading: R0, layers: [8]}       # layers 8-11: the best layer before the last-layer drop (A6)
    - {name: R0_l9, reading: R0, layers: [9]}
    - {name: R0_l10, reading: R0, layers: [10]}
    - {name: R0_l11, reading: R0, layers: [11]}
    - {name: R0_l12, reading: R0, layers: [12]}
    - {name: C1_l12, reading: C1, layers: [12]}
    - {name: C2_l12, reading: C2, layers: [12]}
    - {name: C3_l12, reading: C3, layers: [12]}
    - {name: R_all_l12, reading: R_all, layers: [12]}
    - {name: R0_early, reading: R0, layers: [1, 2, 3, 4]}
    - {name: C2_early, reading: C2, layers: [1, 2, 3, 4]}
