# S1 and S2 (decisions B22, B23) on PartImageNet: the maps only. The model-side reliance test is unchanged, so it
# is not repeated; the analysis takes it from the v3 runs (same images and models).
base: parts.yaml
explanations:
  methods:
    - {name: probe_mass, method: probe, weight: mass, layers: [9, 10, 11, 12]}
    - {name: attention_mass, method: attention, layers: [9, 10, 11, 12]}
parts:
  layerwise_families: [probe, attention, cls_attention]
  reliance: false
