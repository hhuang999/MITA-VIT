# Anatomy on the larger model DeiT-B/16 (decisions B03, B09). Frozen before any DeiT-B result is viewed.
# Same procedures, budgets, image subset and seeds as anatomy_v2.yaml; RQ2 keeps only the main budget.
design: docs/archive/research_design_v2.md
primary: deit_b
model: deit_base_patch16_224.fb_in1k
device: cuda
batch_size: 32
num_workers: 2
subset_seed: 0
n_images: 5000
indices: data/imagenet_val_indices_seed0.json
bootstrap_resamples: 1000
bootstrap_seed: 0
confidence_level: 0.95
random_seeds: [0, 1, 2, 3, 4]

main: {m_side: 4, k: 16, routing: spatial, cls: own, scoring: query, summary_scale: mita}

rq1:
  k: [16]
  per_query_k: [16, 32]
  cls_check: {layer: 12, k: 8}

# RQ2: main budget only (k = 16, m = 16), plus the MiTA default plan; no sweeps.
rq2:
  k_sweep: [16]
  m_sweep: [4]
  settings:
    - {name: L1, mode: L1}
    - {name: L1, mode: L1, k: 32}
    - {name: L2, mode: L2}
    - {name: L3_spatial, mode: L3}
    - {name: L3_dot, mode: L3, routing: dot}
    - {name: L4_spatial, mode: L4}
    - {name: L4_dot, mode: L4, routing: dot}
    - {name: rand, mode: rand, seeds: true}
    - {name: randC, mode: randC, seeds: true}
    - {name: mita_default_dot, mode: L4, m_side: 5, k: 25, routing: dot, cls: routed, landmark_mode: mita}

noise: {shift_pixels: 1}

# DeiT-B/16 published top-1 (Touvron et al. 2021, Table 1): 81.8%. timm's own evaluation pipeline is used
# (Resize 248 bicubic, CenterCrop 224); same tolerance as the DINO check.
repro:
  images: 50000
  reported_top1: 81.8
  tolerance_pp: 0.5

pet:
  images: 3669
  sink_threshold: 3
  composition: [{m_side: 4, k: 16, landmark_mode: clean}, {m_side: 5, k: 25, landmark_mode: clean},
                {m_side: 5, k: 25, landmark_mode: mita}]
  example_indices: [2335, 1874, 989]
  deletion_categories: [sink, foreground, background]
