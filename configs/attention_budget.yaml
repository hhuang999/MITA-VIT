# Attention-budget study (branch study/attention-budget; decisions B27-B31, docs/budget/engineering_design.md).
# T0 model_check, T1/T3 budget, T4 sink_use, T2/T6 register, T7 attention_off.
# Judgements, controls and thresholds are registered in docs/decisions.md before the formal runs.
base: anatomy_deit.yaml
design: docs/budget/engineering_design.md
batch_size: 64
preprocessing: uniform          # every model: Resize 256 bicubic + centre crop 224 (M5); attention_off keeps
                                # each model's own preprocessing, as in the paper's execution figure
pilot_images: 500               # ImageNet-S shuffled with split_seed; first 500 = pilot P, the rest = formal F
split_seed: 0
budget:
  dataset: imagenet_s
  norm_ratio: 3                 # high-norm: block-input norm > 3 x the image's median patch norm (B24)
  deep_layers: [9, 10, 11, 12]
sink_use:
  seeds: [0, 1, 2, 3, 4]        # C2 ring-matched random draws
  value_means: experiments/2026-11-0X_ab_t1_{model}/value_means.pt   # set to the pilot run before T4 (B31)
register:
  presence_share: 0.5           # L*: first layer where >= 50% of pilot images have a high-norm patch
  counts: [1, 2, 4, 8, 16, 32]
  seeds: [0, 1, 2, 3, 4]
  min_reduction: 0.8            # H3 gate: found units remove >= 80% of high-norm patch-layers at L* and later
  min_agreement: 0.95           #   top-1 agreement >= 95%
  max_random_reduction: 0.2     #   random units (mean over seeds) remove <= 20%
  gate: experiments/2026-11-0X_ab_t2_{model}/gate.json   # set to the search run before T6 (B31)
